version: 0.2

# AWS CodeBuild / AWS CodePipeline specification for MOST Travel Payment Gateway
# Validates linting, PCI-DSS compliance security rules, pytest suite, and code coverage

env:
  variables:
    PYTHON_ENV: "test"
    MIN_COVERAGE: "85"

phases:
  install:
    runtime-versions:
      python: 3.12
    commands:
      - echo "==> [AWS CodeBuild] Installing system and python dependencies..."
      - pip install --upgrade pip
      - pip install -r requirements.txt

  pre_build:
    commands:
      - echo "==> [AWS CodeBuild] Running static analysis & security scans..."
      - flake8 app tests --max-line-length=135 --ignore=E203,W503
      - bandit -r app -ll -ii

  build:
    commands:
      - echo "==> [AWS CodeBuild] Running Pytest Suite with coverage..."
      - mkdir -p reports
      - pytest -v --cov=app --cov-report=term-missing --cov-report=xml:reports/coverage.xml --junitxml=reports/junit.xml

  post_build:
    commands:
      - echo "==> [AWS CodeBuild] Build and test phase completed on $(date)"

reports:
  junit_reports:
    files:
      - "reports/junit.xml"
    file-format: "JUNITXML"
  coverage_reports:
    files:
      - "reports/coverage.xml"
    file-format: "COBERTURAXML"

artifacts:
  files:
    - reports/*
    - requirements.txt
    - app/**/*
